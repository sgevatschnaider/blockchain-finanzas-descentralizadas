name: CI sitio estático

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar campus, manifests y enlaces internos
        run: node scripts/validate-static-site.mjs
      - name: Validar U0
        run: node validate.mjs
        working-directory: unidades/u00-clase-inicial-blockchain-negocios
      - name: Validar U1
        run: node validate.mjs
        working-directory: unidades/u01-fundamentos-smart-contracts
      - name: Validar U1 · visor e interacciones
        run: |
          node verify-viewer.cjs
          node verify-interactions.cjs
        working-directory: unidades/u01-fundamentos-smart-contracts
      - name: Preparar navegador para U8
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Verificar visor U8 y descargas
        run: |
          python3 -m http.server 4173 > /tmp/u08-http.log 2>&1 &
          node scripts/browser-u08.cjs
      - name: Verificar cálculos de U8
        run: node scripts/test-u08-math.mjs
      - name: Verificar ocho laboratorios U8
        run: |
          python3 -m http.server 4173 > /tmp/u08-labs-http.log 2>&1 &
          node scripts/browser-u08-labs.cjs
      - name: Conservar capturas y registros de laboratorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u08-laboratorios-qa
          path: artifacts/u08-laboratorios-qa
          retention-days: 14
      - name: Verificar glosario y accesos U8
        run: |
          python3 -m http.server 4173 > /tmp/u08-glossary-http.log 2>&1 &
          node scripts/browser-u08-glossary.cjs
      - name: Conservar capturas del glosario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u08-glosario-qa
          path: artifacts/u08-glosario-qa
          retention-days: 14
