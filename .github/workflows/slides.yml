name: Campus + Slides (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir sitio y slides Marp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sitio
        run: node scripts/validate-static-site.mjs
      - name: Instalar Marp CLI
        run: npm install --global @marp-team/marp-cli@latest
      - name: Preparar campus completo
        shell: bash
        run: |
          mkdir -p site
          rsync -a ./ site/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='site' \
            --exclude='tmp'
          shopt -s globstar
          for source in slides/**/*.md; do
            [ -f "$source" ] || continue
            output="site/${source%.*}.html"
            mkdir -p "$(dirname "$output")"
            marp "$source" --html --allow-local-files --output "$output"
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publicar GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
