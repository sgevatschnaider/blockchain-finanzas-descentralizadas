<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Unidad 3: Ethereum</title>
  <desc id="desc">EVM, contratos inteligentes, Proof of Stake, tokens, Layer 2 y MEV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#17102d"/></linearGradient>
    <linearGradient id="eth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ea2ff"/><stop offset="1" stop-color="#b58cff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <g opacity=".08" stroke="#b9c6ff"><path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200M100 0v420M200 0v420M300 0v420M400 0v420M500 0v420M600 0v420M700 0v420M800 0v420M900 0v420M1000 0v420M1100 0v420"/></g>
  <circle cx="990" cy="204" r="210" fill="url(#glow)"/>
