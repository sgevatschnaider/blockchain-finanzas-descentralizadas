  <text x="70" y="155" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="900">Unidad 3 · Ethereum</text>
  <text x="70" y="212" fill="#c7cff5" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600">De blockchain a la computadora mundial</text>
  <text x="70" y="270" fill="#9ba9bf" font-family="Inter,Arial,sans-serif" font-size="21">Comprender → ejecutar → verificar</text>
  <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">
    <rect x="70" y="310" width="150" height="44" rx="22" fill="#8b5cf6" fill-opacity=".16" stroke="#8b5cf6" stroke-opacity=".65"/><text x="145" y="338" text-anchor="middle" fill="#c4b5fd">12 laboratorios</text>
    <rect x="232" y="310" width="175" height="44" rx="22" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-opacity=".5"/><text x="320" y="338" text-anchor="middle" fill="#67e8f9">136 diapositivas</text>
    <rect x="419" y="310" width="152" height="44" rx="22" fill="#8ea2ff" fill-opacity=".1" stroke="#8ea2ff" stroke-opacity=".5"/><text x="495" y="338" text-anchor="middle" fill="#b8c3ff">88 conceptos</text>
  </g>
